              <h3 class="mb-0" id="main-title">Administrar Doctores</h3>
            </div>
          </div>
        </div>
      </div>
      <div class="app-content">
        <div class="container-fluid" id="user-content-container">

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Agregar Doctor</h3>
                </div>
                <div class="card-body">
                    <form id="addDoctorForm">
                        <div class="mb-3">
                            <label for="doctorName" class="form-label">Nombre del Doctor</label>
                            <input type="text" class="form-control" id="doctorName" required>
                        </div>
                        <div class="mb-3">
                            <label for="doctorSpecialty" class="form-label">Especialidad</label>
                            <input type="text" class="form-control" id="doctorSpecialty" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Agregar Doctor</button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Doctores</h3>
                </div>
                
                <div class="card-body p-0">
                    <p class="text-muted p-3">Una lista de todos los doctores disponibles en tu clínica.</p>

                    <table class="table">
                        <thead>
                            <tr>
                                <th style="width: 40%;">Nombre</th>
                                <th style="width: 35%;">Especialidad</th>
                                <th style="width: 25%;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="doctorsTableBody">
                            
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
      </div>
